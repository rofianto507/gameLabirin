name: kuna_labirin
description: Game petualangan labirin untuk Android TV (Kuna dan Bintang Jatuh).
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Fredoka
      fonts:
        - asset: assets/fonts/Fredoka.ttf
          weight: 400
        - asset: assets/fonts/Fredoka.ttf
          weight: 500
        - asset: assets/fonts/Fredoka.ttf
          weight: 600
        - asset: assets/fonts/Fredoka.ttf
          weight: 700
